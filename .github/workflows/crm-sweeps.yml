name: CRM sweeps (external cron)

# Netlify's scheduled functions stopped executing, so this drives the CRM's
# background sweeps over HTTP instead: the YLA auto-submit sweep and the
# document-reminder sweep. Each keeps its own send gate on the CRM side
# (YLA_AUTOSUBMIT_ENABLED / REMINDERS_ENABLED / CLIENT_DOC_FIXUP_ENABLED), so
# firing this never sends anything that isn't already enabled — it only makes
# the schedule tick.
#
# The endpoint (/api/cron/run) is secret-authed (Authorization: Bearer
# CRON_SECRET, a repo secret) and hit on the Netlify origin (crmnex.netlify.app),
# which bypasses Cloudflare Access — the proxy.ts isCronRoute exemption lets it
# through and the secret is the real auth.

on:
  schedule:
    # Every 2 hours at :30 UTC — mirrors the old Netlify schedule.
    - cron: "30 */2 * * *"
  workflow_dispatch: {} # allow a manual run from the Actions tab

# Never let two sweeps overlap.
concurrency:
  group: crm-sweeps
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger CRM sweeps (YLA + reminders)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set"; exit 1
          fi
          echo "Firing /api/cron/run?job=all …"
          # The AI-heavy YLA sweep runs longer than Netlify's ~30s synchronous
          # gateway limit, so a 504 here is EXPECTED — the function still runs to
          # completion server-side (verified). Only a hard connect failure (000)
          # is a real failure.
          code=$(curl -sS -m 150 -o /tmp/resp -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://crmnex.netlify.app/api/cron/run?job=all" || echo "000")
          echo "HTTP $code"
          head -c 800 /tmp/resp 2>/dev/null || true
          echo
          if [ "$code" = "000" ]; then
            echo "::error::could not reach the CRM cron endpoint"; exit 1
          fi
          if [ "$code" = "401" ]; then
            echo "::error::unauthorised — CRON_SECRET mismatch"; exit 1
          fi
          echo "Triggered (HTTP $code). 504 = sweep still completing server-side; 200 = returned in time."
