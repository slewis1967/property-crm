# Netlify configuration.
#
# The build command / publish dir are configured in the Netlify UI and the
# @netlify/plugin-nextjs runtime; this file only adds what code needs at
# RUNTIME inside the serverless functions.
#
# Server-side PDF generation (app/api/needs-analyses/[id]/pdf) launches headless
# Chromium via @sparticuz/chromium. `serverExternalPackages` (next.config.ts)
# keeps the package unbundled, but the compressed Chromium binary and the YLA
# logo are loaded by PATH at runtime, so they must be force-included in the
# function bundle — nft won't trace a path it never sees as a require().
[functions]
  included_files = [
    "node_modules/@sparticuz/chromium/bin/**",
    "public/yla-logo.png",
  ]

# OCR for TFNs in scanned documents (netlify/functions/tfn-image-redact-background.mts).
# tesseract.js loads its WebAssembly core and worker script by path at runtime,
# which the bundler cannot trace, so ship the packages whole.
[functions."tfn-image-redact-background"]
  node_bundler = "esbuild"
  external_node_modules = ["tesseract.js", "tesseract.js-core"]
