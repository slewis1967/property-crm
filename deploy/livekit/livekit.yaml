# LiveKit SFU config for the self-hosted CRM video server.
#
# Deployed as a Fly.io app running the official `livekit/livekit-server` image
# (see fly.toml + README.md in this folder). This is infrastructure, NOT part
# of the Next.js CRM build — the CRM only talks to it via wss:// (browser) and
# the signed webhook (server -> /api/livekit/webhook).
#
# Secrets (API key/secret) are injected as env vars via `fly secrets`, NOT
# committed here. LIVEKIT_KEYS is read from the environment at boot.

port: 7880 # HTTP + WebSocket signaling (Fly maps 443 -> here)

# Recording (egress) requires the SFU and the egress service to share a Redis.
# UNCOMMENT + fill this in ONLY AFTER Redis is provisioned and reachable — a
# redis block the SFU can't reach will stop it booting and take live calls down.
# See deploy/livekit-egress/README.md.
# redis:
#   address: <REDIS_HOST>:<PORT>
#   username: default
#   password: <REDIS_PASSWORD>
#   db: 0

rtc:
  # Single-port UDP mux keeps Fly networking simple (one UDP service in
  # fly.toml) instead of a wide port range that needs a dedicated IP range.
  udp_port: 7882
  tcp_port: 7881 # TCP fallback for restrictive client networks
  use_external_ip: true

# Keys come from the LIVEKIT_KEYS env var (set via `fly secrets set`):
#   LIVEKIT_KEYS="<API_KEY>: <API_SECRET>"
# These are the SAME key/secret the CRM uses as LIVEKIT_API_KEY /
# LIVEKIT_API_SECRET to mint join tokens and verify webhooks.

# Lifecycle events -> CRM. The URL is the CRM's webhook route; api_key selects
# which key signs the outgoing webhook JWT (verified CRM-side). This is the
# key ID only (NOT the secret) — safe to commit; the matching secret is
# injected at runtime via the LIVEKIT_KEYS Fly secret.
#
# THIS URL NEEDS A CLOUDFLARE ACCESS **BYPASS** APP FOR THE EXACT PATH
# `crm.nextkey.com.au/api/livekit/webhook` — same as the one on /join/*.
#
# Without it, Access 302s the SFU (a machine with no browser session) at the
# edge before Next.js ever runs. That is exactly what happened from 2026-07-16
# to 2026-07-27: every room_started / participant_joined / room_finished was
# bounced, `video_call_events` held zero rows, and the contact call timeline
# stayed blank while the calls themselves worked perfectly. Nothing surfaced it
# — LiveKit logs a 302 as "sent webhook".
#
# The CRM side is already done: proxy.ts `isLivekitWebhookRoute` exempts this
# exact path from the tunnel gate, and the handler verifies the signed webhook
# JWT before writing anything, so the bypass gives up no trust.
#
# FALLBACK if the Access bypass isn't wanted: point this at the Netlify origin
# instead — https://crmnex.netlify.app/api/livekit/webhook — which serves the
# same app with no Access in front. That one needs a `fly deploy` from this
# folder (the config is baked into the image), so it's the slower of the two.
#
# Either way: "sent webhook" in the SFU logs proves nothing about events
# landing. `select count(*) from video_call_events` is the only real check.
webhook:
  api_key: APIb5199261ab47
  urls:
    - https://crm.nextkey.com.au/api/livekit/webhook

# Optional: turn server for clients fully blocked from UDP. LiveKit has an
# embedded TURN; enable + point a subdomain at it if you see connection
# failures behind strict corporate firewalls.
# turn:
#   enabled: true
#   domain: turn.nextkey.com.au
#   tls_port: 5349
#   udp_port: 3478

logging:
  level: info
  json: false
